<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오토웹툰 무료로 시작</title>
<meta name="description" content="구글 계정으로 로그인하면 오토웹툰을 10회차까지 무료로 써 볼 수 있어요.">
<link rel="icon" href="icon-128.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#ffffff; --soft:#f4f4f6; --line:#e8e8ec; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --accent:#3B3FC4; --ok:#1f8a4c; --bad:#d63c3c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101013; --soft:#1a1a1f; --line:#2a2a31; --ink:#f2f3f5; --sub:#b0b8c1; --accent:#7f83f2; --ok:#4cc27e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); word-break:keep-all;
    font:400 16px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  .logo { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:18px; text-decoration:none; color:inherit; }
  .logo img { width:26px; height:26px; border-radius:7px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:28px 0 6px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  #gbtn { min-height:44px; margin-bottom:12px; }
  .msg { min-height:24px; margin:12px 0 0; font-size:16px; font-weight:600; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .fine { color:var(--muted); font-size:14px; margin-top:28px; }
  .fine a { color:inherit; }
</style>
</head>
<body>
<main>
  <a class="logo" href="./"><img src="icon-128.png" alt="">오토웹툰</a>
  <h1 id="h">무료로 시작하기</h1>
  <p class="lead" id="lead">구글 계정으로 로그인하면 10회차까지 무료로 써 볼 수 있어요. 확장 프로그램을 지우고 다시 깔아도 같은 계정이면 남은 회차가 이어져요.</p>
  <div id="gbtn"></div>
  <p class="msg" id="msg" role="status"></p>
  <p class="fine" id="fine">저장하는 것은 구글 계정 번호를 알아볼 수 없게 바꾼 값과, 무료로 본 회차 주소를 바꾼 값뿐이에요. 이메일·이름은 저장하지 않아요. <a href="privacy.html">개인정보 처리방침</a></p>
</main>
<script>
  // 확장 프로그램(login-bridge.js)이 이 페이지에 붙어 있으면 html에 data-aw-ext 가 생긴다.
  // 로그인이 끝나면 무료 표를 data-aw-free 에 올리고 'aw-free' 이벤트를 보낸다 → 확장이 받아서 저장한다.
  const KEY_SERVER = 'https://autowebtoon-key.lovesjy201.workers.dev';
  const EN = new URLSearchParams(location.search).get('lang') === 'en';
  const T = EN ? {
    h: 'Start for free', lead: 'Sign in with Google to use AutoWebtoon free for 10 episodes. Reinstalling keeps your count on the same account.',
    fine: 'We only store a scrambled form of your Google account number and of the free episode addresses. No email or name. ',
    pp: 'Privacy policy', hInst: 'Install with Google', leadInst: 'Sign in with Google and we will take you straight to the install page. After installing, your first 10 episodes are free.', toInst: 'Signed in! Taking you to the install page…', wait: 'Checking…', noext: 'Signed in, but the AutoWebtoon extension was not found in this browser. Install it, then open this page again.',
    done: (n) => `Done! ${n} free episodes left. Go back to your comic tab and tap the page to start.`,
    fail: 'Could not sign in. Please try again.', net: 'Check your internet connection and try again.', notready: 'Sign-in is not ready yet. Please try again later.',
  } : {
    hInst: '구글 계정으로 설치하기', leadInst: '구글 계정으로 로그인하면 바로 설치 화면으로 넘어가요. 설치하면 10회차까지 무료예요.', toInst: '로그인됐어요! 설치 화면으로 넘어갑니다…',
    wait: '확인하는 중…', noext: '로그인은 됐지만 이 브라우저에서 오토웹툰 확장 프로그램을 찾지 못했어요. 설치한 뒤 이 페이지를 다시 열어 주세요.',
    done: (n) => `됐어요! 무료 ${n}회차가 남았어요. 만화 탭으로 돌아가 화면을 누르면 시작해요.`,
    fail: '로그인하지 못했어요. 다시 해 주세요.', net: '인터넷 연결을 확인하고 다시 해 주세요.', notready: '로그인 준비가 아직 안 됐어요. 잠시 뒤 다시 해 주세요.',
  };
  const $ = (id) => document.getElementById(id);
  if (EN) {
    document.documentElement.lang = 'en'; document.title = 'AutoWebtoon – Start for free';
    $('h').textContent = T.h; $('lead').textContent = T.lead;
    $('fine').innerHTML = ''; $('fine').append(T.fine); const a = document.createElement('a'); a.href = 'privacy.html'; a.textContent = T.pp; $('fine').append(a);
  }
  // 확장(login-bridge.js)은 페이지가 뜨기 전에 data-aw-ext 를 붙인다.
  // 없으면 "구글 계정으로 설치하기": 로그인 → 바로 홈페이지 설치 칸으로. 설치 뒤 확장에서 이 페이지를 다시 열면 같은 계정으로 저절로 로그인돼 무료 표가 넘어간다.
  const hasExt = () => document.documentElement.dataset.awExt === '1';
  if (!hasExt()) { $('h').textContent = T.hInst; $('lead').textContent = T.leadInst; }
  const say = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); };

  async function onCred(res) {
    say(T.wait);
    let r;
    try {
      r = await (await fetch(KEY_SERVER + '/free/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: res.credential }) })).json();
    } catch { say(T.net, 'bad'); return; }
    if (!r.ok) { say(T.fail, 'bad'); return; }
    const root = document.documentElement;
    if (!hasExt()) { say(T.toInst, 'ok'); setTimeout(() => { location.href = './' + (EN ? '?lang=en' : '') + '#install'; }, 1200); return; }
    root.dataset.awFree = r.token;
    root.dataset.awLeft = r.left;
    document.dispatchEvent(new CustomEvent('aw-free'));
    // 확장이 받았다고 표시할 때까지 조금 기다린다
    for (let i = 0; i < 20 && root.dataset.awGot !== '1'; i++) await new Promise((ok) => setTimeout(ok, 100));
    say(root.dataset.awGot === '1' ? T.done(r.left) : T.noext, root.dataset.awGot === '1' ? 'ok' : 'bad');
  }

  (async () => {
    let clientId = '';
    try { clientId = (await (await fetch(KEY_SERVER + '/free/config')).json()).clientId; } catch {}
    if (!clientId) { say(T.notready, 'bad'); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: clientId, callback: onCred, ux_mode: 'popup', auto_select: true });
      if (hasExt()) google.accounts.id.prompt();   // 전에 로그인한 계정이면 버튼을 안 눌러도 저절로
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: hasExt() ? 'continue_with' : 'signup_with', locale: EN ? 'en' : 'ko', width: 300 });
    };
    s.onerror = () => say(T.net, 'bad');
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
