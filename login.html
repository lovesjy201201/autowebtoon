<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오토웹툰 무료로 시작</title>
<meta name="description" content="구글이나 네이버 계정으로 로그인하면 오토웹툰을 10회차까지 무료로 써 볼 수 있어요.">
<link rel="icon" href="icon-128.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#ffffff; --soft:#f4f4f6; --line:#e8e8ec; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --accent:#3B3FC4; --ok:#1f8a4c; --bad:#d63c3c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101013; --soft:#1a1a1f; --line:#2a2a31; --ink:#f2f3f5; --sub:#b0b8c1; --accent:#7f83f2; --ok:#4cc27e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); word-break:keep-all;
    font:400 16px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  .logo { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:18px; text-decoration:none; color:inherit; }
  .logo img { width:26px; height:26px; border-radius:7px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:28px 0 6px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  #gbtn { min-height:44px; margin-bottom:12px; }
  #nbtn { display:none; width:300px; max-width:100%; height:44px; border:0; border-radius:22px; background:#03C75A; color:#fff;
    font-family:inherit; font-size:15px; font-weight:600; line-height:44px; cursor:pointer; text-align:center; }
  #nbtn b { font-weight:900; margin-right:8px; }
  .msg { min-height:24px; margin:12px 0 0; font-size:16px; font-weight:600; }
  .msg.ok { color:var(--ok); } .msg.bad { color:var(--bad); }
  .fine { color:var(--muted); font-size:14px; margin-top:28px; }
  .fine a { color:inherit; }
</style>
</head>
<body>
<main>
  <a class="logo" href="./"><img src="icon-128.png" alt="">오토웹툰</a>
  <h1 id="h">무료로 시작하기</h1>
  <p class="lead" id="lead">구글이나 네이버 계정으로 로그인하면 10회차까지 무료로 써 볼 수 있어요. 확장 프로그램을 지우고 다시 깔아도 같은 계정이면 남은 회차가 이어져요.</p>
  <div id="gbtn"></div>
  <button type="button" id="nbtn"><b>N</b><span id="nlabel">네이버로 시작하기</span></button>
  <p class="msg" id="msg" role="status"></p>
  <p class="fine" id="fine">저장하는 것은 구글·네이버 계정 번호를 알아볼 수 없게 바꾼 값과, 무료로 본 회차 주소를 바꾼 값뿐이에요. 이메일·이름은 저장하지 않아요. <a href="privacy.html">개인정보 처리방침</a></p>
</main>
<script>
  // 확장 프로그램(login-bridge.js)이 이 페이지에 붙어 있으면 html에 data-aw-ext 가 생긴다.
  // 로그인이 끝나면 무료 표를 data-aw-free 에 올리고 'aw-free' 이벤트를 보낸다 → 확장이 받아서 저장한다.
  const KEY_SERVER = 'https://autowebtoon-key.lovesjy201.workers.dev';
  const QS = new URLSearchParams(location.search);
  // 네이버 로그인에서 돌아오면 주소에 lang이 없으므로 떠날 때 적어 둔 값을 쓴다
  const ss = (k, v) => { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch { return null; } };
  const EN = QS.get('lang') === 'en' || (QS.has('code') && ss('aw_nlang') === 'en');
  const T = EN ? {
    h: 'Start for free', lead: 'Sign in with Google or Naver to use AutoWebtoon free for 10 episodes. Reinstalling keeps your count on the same account.',
    fine: 'We only store a scrambled form of your Google or Naver account number and of the free episode addresses. No email or name. ',
    pp: 'Privacy policy', hInst: 'Sign in and install', leadInst: 'Sign in with Google or Naver and we will take you straight to the install page. After installing, your first 10 episodes are free.', toInst: 'Signed in! Taking you to the install page…', wait: 'Checking…', noext: 'Signed in, but the AutoWebtoon extension was not found in this browser. Install it, then open this page again.',
    done: (n) => `Done! ${n} free episodes left. Go back to your comic tab and tap the page to start.`,
    naver: 'Continue with Naver', fail: 'Could not sign in. Please try again.', net: 'Check your internet connection and try again.', notready: 'Sign-in is not ready yet. Please try again later.',
  } : {
    hInst: '로그인하고 설치하기', leadInst: '구글이나 네이버 계정으로 로그인하면 바로 설치 화면으로 넘어가요. 설치하면 10회차까지 무료예요.', toInst: '로그인됐어요! 설치 화면으로 넘어갑니다…',
    wait: '확인하는 중…', noext: '로그인은 됐지만 이 브라우저에서 오토웹툰 확장 프로그램을 찾지 못했어요. 설치한 뒤 이 페이지를 다시 열어 주세요.',
    done: (n) => `됐어요! 무료 ${n}회차가 남았어요. 만화 탭으로 돌아가 화면을 누르면 시작해요.`,
    naver: '네이버로 시작하기', fail: '로그인하지 못했어요. 다시 해 주세요.', net: '인터넷 연결을 확인하고 다시 해 주세요.', notready: '로그인 준비가 아직 안 됐어요. 잠시 뒤 다시 해 주세요.',
  };
  const $ = (id) => document.getElementById(id);
  if (EN) {
    document.documentElement.lang = 'en'; document.title = 'AutoWebtoon – Start for free';
    $('h').textContent = T.h; $('lead').textContent = T.lead;
    $('fine').innerHTML = ''; $('fine').append(T.fine); const a = document.createElement('a'); a.href = 'privacy.html'; a.textContent = T.pp; $('fine').append(a);
  }
  // 확장(login-bridge.js)은 페이지가 뜨기 전에 data-aw-ext 를 붙인다.
  // 없으면 "구글 계정으로 설치하기": 로그인 → 바로 홈페이지 설치 칸으로. 설치 뒤 확장에서 이 페이지를 다시 열면 같은 계정으로 저절로 로그인돼 무료 표가 넘어간다.
  const hasExt = () => document.documentElement.dataset.awExt === '1';
  if (!hasExt()) { $('h').textContent = T.hInst; $('lead').textContent = T.leadInst; }
  const say = (t, cls) => { $('msg').textContent = t; $('msg').className = 'msg ' + (cls || ''); };

  async function onCred(res) { await start('/free/start', { credential: res.credential }); }
  async function start(path, body) {
    say(T.wait);
    let r;
    try {
      r = await (await fetch(KEY_SERVER + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
    } catch { say(T.net, 'bad'); return; }
    if (!r.ok) { say(T.fail, 'bad'); return; }
    if (r.nick) $('h').textContent = EN ? `Hi, ${r.nick}!` : `${r.nick}님, 반가워요!`;
    const root = document.documentElement;
    if (!hasExt()) { say(T.toInst, 'ok'); setTimeout(() => { location.href = './' + (EN ? '?lang=en' : '') + '#install'; }, 1200); return; }
    root.dataset.awFree = r.token;
    root.dataset.awLeft = r.left;
    document.dispatchEvent(new CustomEvent('aw-free'));
    // 확장이 받았다고 표시할 때까지 조금 기다린다
    for (let i = 0; i < 20 && root.dataset.awGot !== '1'; i++) await new Promise((ok) => setTimeout(ok, 100));
    say(root.dataset.awGot === '1' ? T.done(r.left) : T.noext, root.dataset.awGot === '1' ? 'ok' : 'bad');
    // 끝났으면 로그인 버튼을 치워서 또 누를 일이 없게 한다
    if (root.dataset.awGot === '1') {
      $('gbtn').style.display = 'none'; $('nbtn').style.display = 'none'; $('lead').style.display = 'none'; try { google.accounts.id.cancel(); } catch {}
      // 이 페이지는 만화 탭에서 새 탭으로 열린 것이라 할 일이 끝나면 닫는다 (브라우저가 막으면 그대로 둔다)
      setTimeout(() => { try { window.close(); } catch {} }, 1500);
    }
  }

  // 네이버 로그인: 네이버 화면으로 갔다가 ?code=&state= 를 달고 이 페이지로 돌아온다
  const NAVER_BACK = location.origin + location.pathname;
  function naverGo(naverId) {
    const st = Array.from(crypto.getRandomValues(new Uint8Array(16)), (x) => x.toString(16).padStart(2, '0')).join('');
    ss('aw_nstate', st); ss('aw_nlang', EN ? 'en' : 'ko');
    const url = 'https://nid.naver.com/oauth2.0/authorize?' + new URLSearchParams({ response_type: 'code', client_id: naverId, redirect_uri: NAVER_BACK, state: st, ...(QS.has('reprompt') ? { auth_type: 'reprompt' } : {}) });
    const w = window.open(url, 'awnaver', 'width=480,height=720');
    if (!w) location.href = url;   // 팝업이 막히면 이 탭에서
  }
  // 팝업이 돌아오면 code를 여기로 넘기고 팝업은 닫힌다
  window.awNaverBack = (code, st) => {
    const want = ss('aw_nstate'); ss('aw_nstate', null);
    if (!code || !st || st !== want) { say(T.fail, 'bad'); return; }
    start('/free/naver', { code, state: st });
  };
  async function naverBack() {
    const code = QS.get('code'), st = QS.get('state');
    let op = null; try { op = window.opener && !window.opener.closed && window.opener.awNaverBack ? window.opener : null; } catch {}
    if (op) { op.awNaverBack(code, st); window.close(); return; }
    const want = ss('aw_nstate');
    ss('aw_nstate', null);
    history.replaceState(null, '', location.pathname + (EN ? '?lang=en' : ''));
    if (!code || !st || st !== want) { say(T.fail, 'bad'); return; }
    await start('/free/naver', { code, state: st });
  }

  (async () => {
    let clientId = '', naverId = '';
    try { const c = await (await fetch(KEY_SERVER + '/free/config')).json(); clientId = c.clientId; naverId = c.naverId || ''; } catch {}
    if (naverId) { $('nlabel').textContent = T.naver; $('nbtn').style.display = 'block'; $('nbtn').onclick = () => naverGo(naverId); }
    if (QS.has('code') || QS.has('error')) { if (QS.has('error')) { try { if (window.opener && window.opener.awNaverBack) { window.close(); return; } } catch {} history.replaceState(null, '', location.pathname + (EN ? '?lang=en' : '')); say(T.fail, 'bad'); } else await naverBack(); }
    if (!clientId) { if (!naverId) say(T.notready, 'bad'); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: clientId, callback: onCred, ux_mode: 'popup', auto_select: true });
      if (hasExt() && !QS.has('code')) google.accounts.id.prompt();   // 전에 로그인한 계정이면 버튼을 안 눌러도 저절로
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: hasExt() ? 'continue_with' : 'signup_with', locale: EN ? 'en' : 'ko', width: 300 });
    };
    s.onerror = () => say(T.net, 'bad');
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
