<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오토웹툰 결제</title>
<meta name="description" content="오토웹툰 이용권 결제. 폰 2,900원, PC 2,900원, 폰+PC 3,900원. 한 번만 결제.">
<link rel="icon" href="icon-128.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#ffffff; --soft:#f4f4f6; --line:#e8e8ec; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --accent:#3B3FC4; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101013; --soft:#1a1a1f; --line:#2a2a31; --ink:#f2f3f5; --sub:#b0b8c1; --accent:#7f83f2; --accent-ink:#0f1020; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); word-break:keep-all;
    font:400 16px/1.6 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 64px; }
  .logo { display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:18px; text-decoration:none; color:inherit; }
  .logo img { width:26px; height:26px; border-radius:7px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:28px 0 6px; }
  .lead { color:var(--sub); margin:0 0 20px; }
  .plans { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px; }
  @media (max-width:420px) { .plan { padding:12px 10px; } .plan b { font-size:20px; } .plan span { font-size:13px; } }
  .plan { all:unset; cursor:pointer; padding:16px; border-radius:16px; background:var(--soft); box-shadow:inset 0 0 0 1px var(--line); }
  .plan[aria-pressed="true"] { box-shadow:inset 0 0 0 2px var(--accent); }
  .plan b { display:block; font-size:24px; letter-spacing:-.02em; }
  .plan span { display:block; font-size:14px; color:var(--sub); }
  .plan:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* 토스 결제 창은 흰 바탕으로 그려지므로 카드 안에 둔다 */
  .widget { background:#fff; border-radius:16px; overflow:hidden; margin-bottom:12px; }
  #pay { width:100%; height:56px; border:0; border-radius:14px; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:17px; font-weight:700; cursor:pointer; }
  #pay:disabled { opacity:.5; cursor:default; }
  .msg { min-height:24px; margin:12px 0 0; color:#d63c3c; font-size:15px; }
  h2 { font-size:18px; margin:36px 0 8px; }
  .again { display:flex; gap:8px; }
  .again input { flex:1; min-width:0; height:48px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--soft); color:var(--ink); font:inherit; }
  .again button { height:48px; padding:0 18px; border:0; border-radius:12px; background:var(--soft); color:var(--accent); font:inherit; font-weight:700; cursor:pointer; box-shadow:inset 0 0 0 1px var(--line); }
  .fine { color:var(--muted); font-size:14px; margin-top:24px; }
  .fine a { color:inherit; }
</style>
</head>
<body>
<main>
  <a class="logo" href="./"><img src="icon-128.png" alt="">오토웹툰</a>
  <h1>이용권 결제</h1>
  <p class="lead">한 번만 결제하면 계속 써요. 결제가 끝나면 바로 키가 나와요.</p>

  <div class="plans" role="group" aria-label="이용권 고르기">
    <button class="plan" data-plan="m" aria-pressed="false"><span>폰</span><b>2,900원</b><span>안드로이드 파이어폭스</span></button>
    <button class="plan" data-plan="p" aria-pressed="false"><span>PC</span><b>2,900원</b><span>PC 크롬</span></button>
    <button class="plan" data-plan="a" aria-pressed="true"><span>폰 + PC</span><b>3,900원</b><span>파이어폭스 + PC 크롬</span></button>
  </div>

  <div class="widget"><div id="payment-method"></div><div id="agreement"></div></div>
  <button id="pay" disabled>결제하기</button>
  <p class="msg" id="msg" role="status"></p>

  <h2 id="again">키 다시 받기</h2>
  <form class="again" action="https://autowebtoon-key.lovesjy201.workers.dev/key" method="get">
    <input name="orderId" placeholder="주문번호 (예: a-1x2y3z...)" required autocomplete="off" spellcheck="false" aria-label="주문번호">
    <button type="submit">받기</button>
  </form>

  <p class="fine">판매: 리듬히어로(대표 신진용, 사업자등록번호 780-66-00795, 통신판매업 신고 제2026-서울서대문-1196호).
    디지털 이용권이라 배송은 없고, 결제 직후 화면에 키를 보여 드려요. 결제 후 7일 안에는 환불해 드려요.
    <a href="terms.html">이용약관·환불 규정</a> · <a href="privacy.html">개인정보 처리방침</a></p>
</main>

<script src="https://js.tosspayments.com/v2/standard"></script>
<script>
  // 토스 결제위젯 클라이언트 키 (리듬히어로 라이브 키. 시험용은 test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm)
  const CLIENT_KEY = 'live_gck_c19znga62iMNJg0Zo2hq8R6wrcTwQQuK94';
  const KEY_SERVER = 'https://autowebtoon-key.lovesjy201.workers.dev';   // 결제 확인 + 키 발급 서버
  const PLANS = { m: { amount: 2900, name: '오토웹툰 이용권 (폰)' }, p: { amount: 2900, name: '오토웹툰 이용권 (PC)' }, a: { amount: 3900, name: '오토웹툰 이용권 (폰+PC)' } };

  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  let plan = ['m', 'p', 'a'].includes(q.get('plan')) ? q.get('plan') : 'a';
  if (q.get('code')) $('msg').textContent = '결제가 끝나지 않았어요: ' + (q.get('message') || q.get('code'));

  let widgets;
  function pick(p) {
    plan = p;
    document.querySelectorAll('.plan').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.plan === p)));
    if (widgets) widgets.setAmount({ currency: 'KRW', value: PLANS[p].amount });
  }
  document.querySelectorAll('.plan').forEach((b) => b.addEventListener('click', () => pick(b.dataset.plan)));
  pick(plan);

  (async () => {
    try {
      const tp = TossPayments(CLIENT_KEY);
      widgets = tp.widgets({ customerKey: TossPayments.ANONYMOUS });
      await widgets.setAmount({ currency: 'KRW', value: PLANS[plan].amount });
      await Promise.all([
        widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' }),
        widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' }),
      ]);
      $('pay').disabled = false;
    } catch (e) {
      $('msg').textContent = '결제 창을 띄우지 못했어요. 잠시 뒤 다시 열어 주세요.';
    }
  })();

  $('pay').addEventListener('click', async () => {
    // 주문번호 맨 앞 글자가 등급(m·p·a). 키 서버가 금액과 맞는지 다시 확인한다.
    const rand = crypto.getRandomValues(new Uint8Array(9));
    const orderId = plan + '-' + Array.from(rand, (x) => x.toString(36).padStart(2, '0')).join('').slice(0, 16);
    try {
      await widgets.requestPayment({
        orderId,
        orderName: PLANS[plan].name,
        successUrl: KEY_SERVER + '/confirm',
        failUrl: location.origin + location.pathname + '?plan=' + plan,
      });
    } catch (e) {
      if (e && e.code !== 'USER_CANCEL') $('msg').textContent = e.message || '결제를 시작하지 못했어요.';
    }
  });
</script>
</body>
</html>
