<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오토웹툰 자유게시판</title>
<meta name="description" content="오토웹툰 만든 사람에게 묻고 싶은 것, 고쳤으면 하는 것, 잘 안 되는 작품을 남겨 주세요.">
<link rel="icon" href="icon-128.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#fff; --soft:#f4f4f6; --line:#e8e8ec; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1; --accent:#3B3FC4; --accent-ink:#fff; --bad:#c33; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101013; --soft:#1a1a1f; --line:#2a2a31; --ink:#f2f3f5; --sub:#b0b8c1; --muted:#8b95a1; --accent:#7f83f2; --accent-ink:#0f1020; --bad:#f07070; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; word-break:keep-all;
    font:400 17px/1.65 "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  a { color:var(--accent); }
  header { border-bottom:1px solid var(--line); }
  header .in { max-width:720px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  header img { width:30px; height:30px; border-radius:8px; }
  header a { color:var(--ink); text-decoration:none; font-weight:700; }
  main { max-width:720px; margin:0 auto; padding:32px 16px 80px; }
  h1 { font-size:30px; line-height:1.3; margin:0 0 8px; letter-spacing:-.02em; }
  .lead { color:var(--sub); margin:0 0 28px; }
  form { background:var(--soft); border-radius:16px; padding:18px; margin:0 0 36px; }
  input[type=text], textarea { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  input[type=text] { margin:0 0 10px; max-width:260px; }
  textarea { min-height:110px; resize:vertical; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; flex-wrap:wrap; }
  .count { color:var(--muted); font-size:14px; }
  button { font:inherit; font-weight:700; background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:10px 22px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:15px; margin:10px 0 0; min-height:1em; }
  .msg.bad { color:var(--bad); }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .post { border-bottom:1px solid var(--line); padding:18px 0; }
  .meta { color:var(--muted); font-size:14px; }
  .text { white-space:pre-wrap; margin:4px 0 0; overflow-wrap:anywhere; }
  .reply { margin:12px 0 0 0; padding:12px 14px; background:var(--soft); border-radius:12px; border-left:3px solid var(--accent); }
  .reply .meta { color:var(--accent); font-weight:700; }
  .empty { color:var(--muted); }
  footer { border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
  footer .in { max-width:720px; margin:0 auto; padding:22px 16px 36px; }
</style>
</head>
<body>
<header><div class="in"><img src="icon-128.png" alt=""><a id="home" href="index.html">오토웹툰</a></div></header>
<main>
  <h1 id="h">자유게시판</h1>
  <p class="lead" id="lead">만든 사람에게 하고 싶은 말을 남겨 주세요. 잘 안 되는 작품, 고쳤으면 하는 것, 궁금한 것 다 좋아요. 읽고 답글 달게요.</p>

  <form id="f" autocomplete="off">
    <input type="text" id="name" maxlength="20" placeholder="이름 (안 써도 돼요)">
    <div class="hp" aria-hidden="true"><input type="text" id="website" tabindex="-1"></div>
    <textarea id="text" maxlength="500" placeholder="여기에 써 주세요" required></textarea>
    <div class="row"><span class="count" id="count">0 / 500</span><button id="send" type="submit">올리기</button></div>
    <p class="msg" id="msg"></p>
  </form>

  <div id="list"><p class="empty" id="loading">불러오는 중…</p></div>
</main>
<footer><div class="in"><span id="foot">주소(링크)가 든 글은 올라가지 않아요. 남을 해치는 글은 지울 수 있어요.</span> · <a id="priv" href="privacy.html">개인정보</a></div></footer>
<script>
  const API = 'https://autowebtoon-key.lovesjy201.workers.dev/board';
  const q = new URLSearchParams(location.search);
  const en = q.get('lang') === 'en' || (q.get('lang') !== 'ko' && !/^ko/i.test(navigator.language || ''));
  const T = en ? {
    title: 'AutoWebtoon board', h: 'Board', home: 'AutoWebtoon',
    lead: 'Leave a message for the developer: a series that does not work well, something you want changed, or a question. I read everything and reply here.',
    name: 'Name (optional)', text: 'Write here', send: 'Post', guest: 'Guest', dev: 'Developer reply',
    foot: 'Posts with links are blocked. Posts that hurt others may be removed.', priv: 'Privacy',
    empty: 'No posts yet. Be the first.', loading: 'Loading…', ok: 'Posted. Thank you!', fail: 'Could not post. Please try again later.',
    short: 'Please write a little more.', link: 'Posts with links (http, www, .com…) cannot be posted.', limit: 'You can post up to 5 times a day.', loadfail: 'Could not load the board.'
  } : {
    title: '오토웹툰 자유게시판', h: '자유게시판', home: '오토웹툰',
    lead: document.getElementById('lead').textContent,
    name: '이름 (안 써도 돼요)', text: '여기에 써 주세요', send: '올리기', guest: '손님', dev: '만든 사람 답글',
    foot: document.getElementById('foot').textContent, priv: '개인정보',
    empty: '아직 글이 없어요. 처음으로 남겨 주세요.', loading: '불러오는 중…', ok: '올렸어요. 고맙습니다!', fail: '못 올렸어요. 조금 뒤에 다시 해 주세요.',
    short: '조금만 더 써 주세요.', link: '주소(http·www·.com 등)가 든 글은 올릴 수 없어요.', limit: '하루에 5개까지 쓸 수 있어요.', loadfail: '게시판을 불러오지 못했어요.'
  };
  const $ = (id) => document.getElementById(id);
  if (en) {
    document.documentElement.lang = 'en'; document.title = T.title;
    $('h').textContent = T.h; $('lead').textContent = T.lead; $('home').textContent = T.home; $('home').href = 'index-en.html';
    $('name').placeholder = T.name; $('text').placeholder = T.text; $('send').textContent = T.send;
    $('foot').textContent = T.foot; $('priv').textContent = T.priv; $('loading').textContent = T.loading;
  }
  const when = (t) => { const d = new Date(t); return d.toLocaleDateString(en ? 'en-US' : 'ko-KR', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(en ? 'en-US' : 'ko-KR', { hour: '2-digit', minute: '2-digit' }); };
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  let mine = null;   // 방금 쓴 글: 서버 목록은 반영이 1분쯤 늦어서, 목록에 없으면 맨 위에 붙여 보여 준다
  async function load() {
    try {
      const r = await fetch(API, { cache: 'no-store' }); const d = await r.json();
      const list = $('list'); list.textContent = '';
      const posts = d.posts || [];
      if (mine && !posts.some((p) => p.id === mine.id)) posts.unshift(mine);
      if (!posts.length) { list.append(el('p', 'empty', T.empty)); return; }
      for (const p of posts) {
        const box = el('div', 'post');
        box.append(el('div', 'meta', (p.name || T.guest) + ' · ' + when(p.t)), el('div', 'text', p.text));
        if (p.reply) { const rp = el('div', 'reply'); rp.append(el('div', 'meta', T.dev), el('div', 'text', p.reply)); box.append(rp); }
        list.append(box);
      }
    } catch (e) { $('list').textContent = ''; $('list').append(el('p', 'empty', T.loadfail)); }
  }
  $('text').addEventListener('input', () => { $('count').textContent = $('text').value.length + ' / 500'; });
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('msg'); msg.className = 'msg'; msg.textContent = '';
    $('send').disabled = true;
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('name').value, text: $('text').value, website: $('website').value, lang: en ? 'en' : 'ko' }) });
      const d = await r.json().catch(() => ({}));
      if (d.ok) { mine = { id: d.id, name: $('name').value.trim(), text: $('text').value.trim(), t: Date.now(), reply: '' }; msg.textContent = T.ok; $('text').value = ''; $('count').textContent = '0 / 500'; load(); }
      else { msg.className = 'msg bad'; msg.textContent = T[d.reason] || T.fail; }
    } catch (err) { msg.className = 'msg bad'; msg.textContent = T.fail; }
    $('send').disabled = false;
  });
  load();
</script>
</body>
</html>
